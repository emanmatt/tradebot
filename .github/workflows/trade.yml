name: Trade bot

on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no orders)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tradebot
  cancel-in-progress: false

defaults:
  run:
    working-directory: tradebot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m bot.main --dry-run
          else
            python -m bot.main --once
          fi
      - name: Save trade journal
        if: always()
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          git add -f data/journal.sqlite data/cache || true
          git diff --cached --quiet || git commit -m "journal: $(date -u +%F)" && git push
