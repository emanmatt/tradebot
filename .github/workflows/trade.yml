name: Trade bot

# Trades all day in two back-to-back sessions (GitHub jobs max out at 6 hours):
#   morning   9:25 AM -> 12:45 PM New York
#   afternoon 12:40 PM -> 3:58 PM New York (waits for the morning one to finish)
# Times below are UTC for winter and summer; runs that land outside trading
# hours exit immediately, so daylight saving is handled automatically.
on:
  schedule:
    - cron: "25 14 * * 1-5"   # morning   (winter)
    - cron: "40 17 * * 1-5"   # afternoon (winter)
    - cron: "25 13 * * 1-5"   # morning   (summer)
    - cron: "40 16 * * 1-5"   # afternoon (summer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (one scan, no orders)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tradebot
  cancel-in-progress: false

defaults:
  run:
    working-directory: tradebot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m bot.day --dry-run
          else
            python -m bot.day --auto
          fi
      - name: Save trade journal
        if: always()
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          git add -f data/journal.sqlite data/cache || true
          git diff --cached --quiet || git commit -m "journal: $(date -u +%F)"
          git pull --rebase -q -X ours || true
          git push || true
