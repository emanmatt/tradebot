name: Trade bot

# Started at 9:20 AM New York by cron-job.org (reliable). The morning session
# then starts the afternoon session itself at 12:45. The GitHub timers below are
# only backups; any duplicate run waits its turn and exits if it isn't needed.
on:
  schedule:
    - cron: "25 14 * * 1-5"   # backup morning   (winter)
    - cron: "40 17 * * 1-5"   # backup afternoon (winter)
    - cron: "25 13 * * 1-5"   # backup morning   (summer)
    - cron: "40 16 * * 1-5"   # backup afternoon (summer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (one scan, no orders)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write              # lets the morning session start the afternoon one

concurrency:
  group: tradebot
  cancel-in-progress: false

defaults:
  run:
    working-directory: tradebot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # always start from the LATEST journal, not the one at trigger time
          fetch-depth: 0          # full history so the save step can replay cleanly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m bot.day --dry-run
          else
            python -m bot.day --auto
          fi
      - name: Save trade journal
        if: always()
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          git add -f data/journal.sqlite
          git add -f data/cache 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "journal: $(date -u +%F)"
          for i in 1 2 3; do
            # sessions run one at a time, so the journal itself never conflicts;
            # this only replays our commit on top of any files you uploaded meanwhile
            git fetch -q origin main
            if git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then
              echo "journal saved"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::could not save the trade journal"
          exit 1
