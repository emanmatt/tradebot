# ---------------------------------------------------------------
# Swing trading bot settings. Every number here is a choice YOU make.
# Defaults are conservative starting points, not recommendations.
# ---------------------------------------------------------------

mode: paper            # paper | live  (live also needs CONFIRM_LIVE=YES in .env)

# ---------- DAY TRADING (what the GitHub schedule runs) ----------
# All day: buy breakouts, sell on stop / target / failed move / time limit, repeat. Flat by the close.
day:
  entry_window_et: ["09:45", "15:15"]  # new buys allowed in this window, all day
  flatten_at_et: "15:50"        # sell anything still open before the close
  morning_until_et: "12:45"     # GitHub jobs max 6h, so the day runs as two sessions
  afternoon_from_et: "12:40"
  afternoon_until_et: "15:58"

  # ---- speed (fix 3) ----
  tick_sec: 15                  # check the open trade every 15 seconds
  scan_every_sec: 30            # look for a new trade every 30 seconds while flat
  cooldown_min: 2               # pause after a sale before the next buy
  universe_refresh_sec: 300     # refresh the list of active stocks every 5 min

  # ---- entries: buy the pullback, not the spike ----
  pullback_buffer_pct: 0.1      # bid at the breakout level (+0.1%) instead of the current price
  pullback_wait_sec: 120        # wait up to 2 min for the dip; no dip = no trade
  no_pullback_retry_min: 5      # if it never dipped, ignore that stock for 5 min
  fill_timeout_sec: 15          # (fallback wait for other buy orders)

  # ---- what counts as a setup (1-minute bars) ----
  or_minutes: 15                # opening range = first 15 minutes
  base_minutes: 30              # must clear the high of the last 30 minutes too
  atr_bars: 15                  # "normal move" = average of the last 15 one-minute ranges
  universe_top: 50              # scan today's 50 most active + 50 top gainers
  min_price: 2                  # moderate: was 3
  max_price: 60                 # small account: keep share prices affordable
  min_rvol: 1.3                 # moderate: volume at least 1.3x normal (was 1.5)
  min_gap_pct: 0.5              # moderate: gapped up at least 0.5% (was 1)...
  max_gap_pct: 20               # ...but not a 20%+ moonshot
  max_extension_pct: 2.0        # moderate: may buy up to 2% past the breakout (was 1.5)
  max_pullback_pct: 2           # skip if it's already fading off the day's high
  min_score: 0.45               # moderate: was 0.5
  follow_bonus: 0.15            # small boost if insiders/funds/etc. also like it

  # ---- stops (fix 5) ----
  stop_atr_mult: 1.5            # stop = 1.5x the stock's normal 1-minute move...
  min_stop_pct: 0.8             # ...but at least 0.8% away...
  max_stop_pct: 3               # ...and at most 3% away
  min_stop_usd: 0.05            # ...and never closer than 5 cents (cheap stocks wobble)

  # ---- exits (fix 4) ----
  reward_risk: 1.5              # profit target = 1.5x the risk
  breakeven_at_r: 0.75          # once up 0.75x the risk, stop moves to break-even
  time_stop_min: 15             # sell if it hasn't gained...
  time_stop_gain_r: 0.25        # ...at least 0.25x the risk within 15 minutes
  exit_below_vwap: true         # sell if a 1-min bar closes back under VWAP...
  vwap_exit_after_min: 2        # ...after the first 2 minutes

  # ---- risk (hard limits) ----
  risk_per_trade_pct: 3         # moderate: max loss per trade if the stop hits (3% of $100 = $3)
  max_position_pct: 100         # small account: one position may use the whole balance
  # no cap on trades per day: the daily loss limit is the brake
  max_open_positions: 1
  max_daily_loss_pct: 6         # moderate: stop buying after a -6% day (was 3)
  max_drawdown_pct: 20          # halt if account falls 20% from its high

schedule:
  run_time_et: "10:00" # daily run, 30 min after the open (avoids opening volatility)
  timezone: "America/New_York"

# SEC requires a contact in the User-Agent for EDGAR requests (your name + email)
sec_user_agent: "Emmanuel emanmatt711@gmail.com"

# ---------- Who to follow ----------
signals:
  weights:             # how much each source counts (normalized automatically)
    insiders: 0.35     # Form 4 open-market purchases (fastest, ~2 day lag)
    congress: 0.25     # congressional disclosures (weeks of lag)
    funds_13f: 0.25    # hedge fund 13F new/increased positions (up to 45 day lag)
    social: 0.15       # Reddit mention growth (noisy; kept low on purpose)
    etoro: 0.30        # new buys by top-ranked eToro traders (eToro-verified results)

  etoro:
    period: "AbsOneYear"       # rank on the trailing 12 months
    top_traders: 15            # how many traders to follow
    max_risk_score: 5          # eToro risk score 1-10; 5 or lower = steadier traders
    max_drawdown_pct: 30       # skip anyone who fell more than this from a peak
    min_copiers: 300           # others must trust them with real money
    lookback_days: 14          # count positions opened in the last 2 weeks

  insiders:
    lookback_days: 7
    min_value_usd: 100000      # ignore small token buys
    exec_titles: ["CEO", "CFO", "COO", "Pres", "Chairman", "Dir"]

  congress:
    lookback_days: 45
    min_amount_usd: 15001      # lower bound of the disclosed range

  funds_13f:
    # SEC CIK numbers of funds to follow. Edit freely.
    funds:
      Berkshire Hathaway: "0001067983"
      Pershing Square: "0001336528"
      Appaloosa: "0001656456"
      Scion Asset Mgmt: "0001649339"
      Duquesne Family Office: "0001536411"
    min_increase_pct: 25       # count a position if it grew by at least this much
    min_position_usd: 10000000

  social:
    min_mentions: 25
    min_growth: 1.5            # mentions now vs 24h ago

# ---------- Trend filter (must pass before any buy) ----------
trend:
  lookback_days: 300
  rsi_min: 40
  rsi_max: 75                  # skip names that are already overextended
  require_above_sma50: true
  require_sma20_above_sma50: true
  min_price: 5
  min_avg_dollar_volume: 5000000

# ---------- Entry ----------
entry:
  min_score: 0.45              # combined score 0..1 needed to buy
  min_sources: 1               # how many follow-sources must flag the ticker
  follow_weight: 0.6           # final = follow_weight*follow + (1-follow_weight)*trend

# ---------- Risk (hard limits) ----------
risk:
  risk_per_trade_pct: 1.0      # max $ loss per trade if the stop hits, % of equity
  max_position_pct: 10.0       # max size of one position, % of equity
  max_total_exposure_pct: 80.0 # max invested, % of equity
  max_positions: 8
  max_new_per_day: 2
  stop_atr_mult: 2.0           # stop-loss distance = 2 x ATR(14)
  reward_risk: 2.5             # take-profit at 2.5x the stop distance
  max_daily_loss_pct: 3.0      # no new buys if down this much today
  max_drawdown_pct: 15.0       # halt all buying if equity falls this far from peak

# ---------- Exits (on top of the bracket stop/target) ----------
exit:
  max_hold_days: 30
  exit_below_sma50: true

journal_path: "data/journal.sqlite"
cache_dir: "data/cache"
